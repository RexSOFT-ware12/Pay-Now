services:
  - type: web
    name: fabricnow-pay
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: GATEWAY_INTERNAL_SECRET
        sync: false
      - key: ADMIN_API_KEY
        sync: false
