services:
  - type: web
    name: fabricnow-pay
    runtime: node
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: GATEWAY_INTERNAL_SECRET
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: STYLE_CALLBACK_URL
        sync: false
      - key: STYLE_EVENT_URL
        sync: false
      - key: STYLE_EVENT_SECRET
        sync: false
      - key: STYLE_PLAN_CODES
        sync: false
      - key: QWESI_CALLBACK_URL
        sync: false
      - key: QWESI_EVENT_URL
        sync: false
      - key: QWESI_EVENT_SECRET
        sync: false
      - key: QWESI_PLAN_CODES
        sync: false
